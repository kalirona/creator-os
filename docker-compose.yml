services:
  creator-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creator-os
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/creatoros.db
      - AUTH_SECRET=change-me-to-strong-32-char-string-now
      - AUTH_COOKIE_SECURE=false
      - PRIMARY_HOSTS=
    volumes:
      - creator-os-data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3007').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  creator-os-data:
